name: Validate Legacy Release and Draft

on:
  pull_request:
    paths:
      - 'review/**'
      - 'releases/**'
      - 'drafts/core/**'
      - 'scripts/**'
      - 'tests/legacy/**'
      - 'standards/**'
      - '.github/workflows/validate-release-contract.yml'
      - '.github/workflows/update-latest.yml'
  push:
    branches: [ main ]
    paths:
      - 'review/**'
      - 'releases/**'
      - 'drafts/core/**'
      - 'scripts/**'
      - 'tests/legacy/**'
      - 'standards/**'
      - '.github/workflows/validate-release-contract.yml'
      - '.github/workflows/update-latest.yml'

permissions:
  contents: read

jobs:
  validate-released-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Coverage audit verifies three pinned historical graph revisions.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Validate exact published artifacts against their legacy release contract
        run: python3 scripts/validate_release_contract.py
      - name: Verify frozen institutional review snapshot
        run: python3 review/2026-10-11.1/verify-snapshot.py
      - name: Verify review ZIP matches its guides and frozen source
        run: python3 scripts/verify_review_bundle.py
      - name: Verify the current review uses the same current source and dataset
        run: python3 scripts/build_current_review.py --check
      - name: Run legacy preservation and input-binding regressions
        run: python3 -m unittest discover -s tests/legacy -v

  validate-draft-authoring:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Coverage audit verifies three pinned historical graph revisions.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Validate graph structure, evidence profile and scenarios
        run: >-
          python3 scripts/lint_core_graph_quality.py
          --graph-path drafts/core/tensor.core.graph.json
          --entry-path drafts/core/source/entry_nodes.json
          --output-dir "${{ runner.temp }}/tensor-draft-quality"
      - name: Verify reproducible author review and complete coverage ledger
        run: |
          python3 scripts/restore_original_questions.py --check
          python3 scripts/audit_graph_coverage.py --check
          python3 scripts/evaluate_entry_scenarios.py
      - name: Retain digest-bound draft reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legacy-draft-authoring-report
          path: ${{ runner.temp }}/tensor-draft-quality
          if-no-files-found: warn
