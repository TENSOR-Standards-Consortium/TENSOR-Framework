name: Verify Latest Release Pointers

# Latest pointers and checksums are reviewed together with the release manifest.
# Never infer a promotion by directory sorting or push an automatic repair commit.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'releases/**'
      - '.github/workflows/update-latest.yml'
  push:
    branches: [ main ]
    paths:
      - 'releases/**'
      - '.github/workflows/update-latest.yml'

permissions:
  contents: read

jobs:
  verify-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify manifest-selected latest pointers and release checksums
        run: python3 scripts/validate_release_contract.py
