version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      patches:
        update-types: [patch]
    open-pull-requests-limit: 3
